name: Yorunote Android candidate
on:
  push:
    branches: [release/android-0.1.0]

permissions:
  contents: read

concurrency:
  group: yorunote-android-candidate
  cancel-in-progress: false

jobs:
  android-arm64:
    if: github.repository_id == '1421354314'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      YORUNOTE_ANDROID_CANDIDATE: 'true'
      EXPECTED_PACKAGE: com.mengwenliu.yorunote.candidate
      EXPECTED_VERSION: '0.1.0'
      NDK_VERSION: '28.0.13004108'
      BUILD_TOOLS: '36.0.0'
    steps:
      - name: Check out the candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.41.4
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.41.4'
          cache: true

      - name: Check source and install Android toolchain
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          flutter --version
          dart --version 2>&1 | grep -E 'Dart SDK version: 3\.11\.1\b'
          rustup target add aarch64-linux-android
          rustc --version | grep -E '^rustc 1\.85\.1\b'
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION"
          test -x "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          df -h .

      - name: Resolve dependencies and run focused regressions
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock
          flutter analyze --no-pub \
            lib/components/yorunote_mascot.dart \
            lib/components/windows_title_brand.dart \
            lib/foundation/yorunote_release.dart \
            lib/pages/settings/settings_page.dart \
            test/foundation/yorunote_release_test.dart
          flutter test --no-pub --reporter expanded \
            test/brand/yorunote_brand_test.dart \
            test/brand/windows_title_brand_test.dart \
            test/brand/windows_window_frame_overlay_test.dart \
            test/foundation/favorites_follow_updates_test.dart \
            test/foundation/yorunote_release_test.dart \
            test/reader/reader_image_loading_test.dart \
            test/ui/home_page_test.dart

      - name: Create a runner-local candidate signing key
        run: |
          umask 077
          dir="$RUNNER_TEMP/yorunote-candidate-signing"
          mkdir "$dir"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          export YORUNOTE_CANDIDATE_PASSWORD="$password"
          keytool -genkeypair -keystore "$dir/candidate.p12" -storetype PKCS12 \
            -alias candidate -keyalg RSA -keysize 2048 -validity 365 \
            -storepass:env YORUNOTE_CANDIDATE_PASSWORD \
            -dname 'CN=Yorunote Candidate, O=CI Test Only' >/dev/null
          keytool -exportcert -keystore "$dir/candidate.p12" -alias candidate \
            -storepass:env YORUNOTE_CANDIDATE_PASSWORD | sha256sum | cut -d' ' -f1 \
            > "$dir/certificate.sha256"
          git check-ignore -q android/key.properties
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=candidate\nstoreFile=%s\n' \
            "$password" "$password" "$dir/candidate.p12" > android/key.properties

      - name: Build the Android ARM64 Release-mode candidate
        run: |
          flutter build apk --release --no-pub --target-platform android-arm64 \
            --split-per-abi "--dart-define=YORUNOTE_ANDROID_VERSION=$EXPECTED_VERSION"

      - name: Verify package, version, native libraries and signing certificate
        run: |
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f "$apk"
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          dist="$RUNNER_TEMP/yorunote-android-candidate"
          mkdir "$dist"
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee "$dist/apksigner.txt"
          grep -Fxq 'Number of signers: 1' "$dist/apksigner.txt"
          grep -Eq '^Verified using v[23] scheme .*: true$' "$dist/apksigner.txt"
          expected="$(cat "$RUNNER_TEMP/yorunote-candidate-signing/certificate.sha256")"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$dist/apksigner.txt")"
          [[ "$expected" =~ ^[a-f0-9]{64}$ && "$actual" == "$expected" ]]
          "$bt/aapt2" dump badging "$apk" | tee "$dist/badging.txt"
          grep -Fq "package: name='$EXPECTED_PACKAGE' " "$dist/badging.txt"
          grep -Fq " versionName='$EXPECTED_VERSION'" "$dist/badging.txt"
          grep -Fxq "application-label:'Yorunote Candidate'" "$dist/badging.txt"
          grep -Fxq "native-code: 'arm64-v8a'" "$dist/badging.txt"
          code="$(sed -n "s/^package:.* versionCode='\([0-9]*\)'.*/\1/p" "$dist/badging.txt")"
          [[ "$code" =~ ^[0-9]+$ && "$code" -gt 2163 ]]
          unzip -tq "$apk"
          "$bt/zipalign" -c 4 "$apk"
          unzip -Z1 "$apk" | awk -F/ '$1=="lib" && $3 ~ /\.so$/ {print $2}' | sort -u \
            > "$dist/abis.txt"
          grep -Fxq 'arm64-v8a' "$dist/abis.txt"
          test "$(wc -l < "$dist/abis.txt")" -eq 1
          for name in libapp.so libflutter.so librhttp.so; do
            unzip -p "$apk" "lib/arm64-v8a/$name" >/dev/null
          done
          unzip -p "$apk" 'assets/flutter_assets/assets/brand/yorunote_mascot.gif' |
            cmp - assets/brand/yorunote_mascot.gif
          name="Yorunote-$EXPECTED_VERSION-android-arm64-candidate.apk"
          cp "$apk" "$dist/$name"
          (cd "$dist" && sha256sum "$name" | tee "$name.sha256")
          printf 'source=%s\npackage=%s\nversionName=%s\nversionCode=%s\ncertificateSHA256=%s\n' \
            "$GITHUB_SHA" "$EXPECTED_PACKAGE" "$EXPECTED_VERSION" "$code" "$actual" \
            | tee "$dist/build-info.txt"
          git diff --exit-code HEAD

      - name: Remove temporary signing materials
        if: always()
        run: |
          rm -f -- android/key.properties \
            "$RUNNER_TEMP/yorunote-candidate-signing/candidate.p12"

      - name: Upload the verified candidate and evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: yorunote-android-arm64-0.1.0-candidate
          path: ${{ runner.temp }}/yorunote-android-candidate/
          if-no-files-found: error
          retention-days: 14
