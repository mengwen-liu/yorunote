name: Yorunote Windows Diagnostics
on:
  push:
    branches: ['codex/yorunote-windows-preview-20261106']
    paths: ['.github/workflows/yorunote-windows-diagnostics.yml']
permissions:
  actions: read
  contents: read
jobs:
  read-evidence:
    if: github.repository_id == '1421354314'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Read existing startup evidence without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/mengwen-liu/yorunote/actions/artifacts/13438480247/zip > evidence.zip
          python3 - <<'PY'
          import base64, hashlib, pathlib, zipfile
          data = pathlib.Path("evidence.zip").read_bytes()
          assert hashlib.sha256(data).hexdigest() == "a319edc30cd502a00bc218689c55815e9c52ef41a093e6a305150e0b5fb3c342"
          with zipfile.ZipFile("evidence.zip") as archive:
              print("FILES", archive.namelist())
              for name in archive.namelist():
                  p = pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and ".." not in p.parts
                  if p.name in {"distribution-stdout.log", "distribution-stderr.log", "source.json", "authenticode.json"}:
                      raw = archive.read(name)
                      print("BEGIN_TEXT", p.name, "BYTES", len(raw))
                      print(raw.decode("utf-8-sig", errors="replace")[:20000])
                      print("END_TEXT", p.name)
                  if p.name == "windows-icon-preview.png":
                      encoded = base64.b64encode(archive.read(name)).decode("ascii")
                      print("BEGIN_ICON_BASE64")
                      for i in range(0, len(encoded), 512):
                          print("ICON_CHUNK " + encoded[i:i + 512])
                      print("END_ICON_BASE64")
          PY
