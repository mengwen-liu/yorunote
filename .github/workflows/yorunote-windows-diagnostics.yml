name: Yorunote Windows Mascot Settled Preview
run-name: Read settled Windows mascot screenshot - 6df02c0f
on:
  push:
    branches: ['codex/yorunote-windows-mascot-20261106']
    paths: ['.github/workflows/yorunote-windows-diagnostics.yml']
permissions:
  actions: read
  contents: read
jobs:
  read-settled-preview:
    if: github.repository_id == '1421354314' && github.ref == 'refs/heads/codex/yorunote-windows-mascot-20261106'
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Read stable screenshot from the same verified evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/mengwen-liu/yorunote/actions/artifacts/13495941382/zip > evidence.zip
          python3 - <<'PY'
          import base64,hashlib,pathlib,zipfile
          raw=pathlib.Path("evidence.zip").read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="45cdfe09f83dd1420a06bd3c10c3bbf40af15836123f91c454f513ca78b6f824"
          with zipfile.ZipFile("evidence.zip") as archive:
              print("PNG_NAMES", [p for p in archive.namelist() if p.endswith(".png")])
              selected=[p for p in archive.namelist() if p.endswith(".png") and "home-after-restart" in p]
              assert len(selected)==1,selected
              print("BEGIN_STABLE_DARK_PNG")
              print(base64.b64encode(archive.read(selected[0])).decode())
              print("END_STABLE_DARK_PNG")
          PY
