name: Yorunote Windows Diagnostics
run-name: Reader loading dependency regression - 0254b07f
on:
  push:
    branches: ['codex/yorunote-windows-preview-20261106']
    paths: ['.github/workflows/yorunote-windows-diagnostics.yml']
permissions:
  contents: read
jobs:
  reader-regression:
    if: github.repository_id == '1421354314' && github.ref == 'refs/heads/codex/yorunote-windows-preview-20261106'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '0254b07f664e77661c092478ce3a8a2201e39bf8'
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Resolve the unchanged lockfile
        run: flutter pub get --enforce-lockfile
      - name: Check real image loading on dependency changes
        run: |
          flutter analyze --no-pub lib/components/reader_image_loading.dart test/reader/reader_image_loading_test.dart
          flutter test --no-pub --reporter expanded test/reader/reader_image_loading_test.dart
      - name: Read exact formatter output
        if: always()
        run: |
          python3 - <<'PY'
          import subprocess
          for path in ['lib/components/reader_image_loading.dart', 'test/reader/reader_image_loading_test.dart']:
              text = subprocess.check_output(['dart','format','--output=show',path],text=True)
              print('BEGIN_FORMATTED '+path, flush=True)
              print(text, flush=True)
              print('END_FORMATTED '+path, flush=True)
          PY
