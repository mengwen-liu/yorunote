name: Yorunote Windows Diagnostics
run-name: Verify public Windows preview - v0.1.0-windows-preview.1
on:
  push:
    branches: ['codex/yorunote-windows-preview-20261106']
    paths: ['.github/workflows/yorunote-windows-diagnostics.yml']
permissions:
  actions: read
  contents: read
jobs:
  verify-public:
    if: github.repository_id == '1421354314'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Read published metadata and download both public attachments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/mengwen-liu/yorunote/releases/436235827 > release.json
          gh api repos/mengwen-liu/yorunote/git/ref/tags/v0.1.0-windows-preview.1 > tag.json
          gh api repos/mengwen-liu/yorunote/actions/workflows/386674685 > build-all.json
          gh api repos/mengwen-liu/yorunote/actions/workflows/main.yml/runs?per_page=1 > build-all-runs.json
          gh api repos/mengwen-liu/yorunote/actions/workflows/update_alt_store.yml/runs?per_page=1 > altstore-runs.json
          curl --fail --location --silent --show-error --retry 0 --proto '=https' -o public.zip https://github.com/mengwen-liu/yorunote/releases/download/v0.1.0-windows-preview.1/Yorunote_windows_x64_71485c7d_preview.zip
          curl --fail --location --silent --show-error --retry 0 --proto '=https' -o public.sha256 https://github.com/mengwen-liu/yorunote/releases/download/v0.1.0-windows-preview.1/Yorunote_windows_x64_71485c7d_preview.zip.sha256
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          def read(name):
              return json.loads(pathlib.Path(name).read_text())
          release = read("release.json")
          tag = read("tag.json")
          source = "71485c7de8799e30c9e1b5797ad83fba65668d51"
          filename = "Yorunote_windows_x64_71485c7d_preview.zip"
          expected = "5bc2853adb6b303ef42ee9f070ac5bae9a6c9f5849f5b3fdc4e125dcbe9edac5"
          assert release["id"] == 436235827 and release["draft"] is False and release["prerelease"] is True
          assert release["published_at"] and release["tag_name"] == "v0.1.0-windows-preview.1"
          assert tag["object"]["type"] == "commit" and tag["object"]["sha"] == source
          assert {a["name"] for a in release["assets"]} == {filename,filename+".sha256"}
          raw = pathlib.Path("public.zip").read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          assert len(raw) == 21528589 and digest == expected
          checksum = pathlib.Path("public.sha256").read_bytes()
          assert checksum == (digest+"  "+filename+chr(10)).encode()
          assert hashlib.sha256(checksum).hexdigest() == "e327ff0f86f073a9897d20833291e95423c8c90b652a540cbc383e695bd698fb"
          with zipfile.ZipFile("public.zip") as archive:
              assert archive.testzip() is None
              assert json.loads(archive.read("Yorunote/BUILD_INFO.json"))["source_commit"] == source
          assert read("build-all.json")["state"] == "active"
          assert read("build-all-runs.json")["total_count"] == 0
          assert read("altstore-runs.json")["total_count"] == 0
          result = {
              "release_id":release["id"],"url":release["html_url"],"published_at":release["published_at"],
              "draft":release["draft"],"prerelease":release["prerelease"],
              "tag":tag["ref"],"source_commit":source,
              "zip":filename,"zip_bytes":len(raw),"zip_sha256":digest,
              "checksum_sha256":hashlib.sha256(checksum).hexdigest(),
              "public_downloads_without_authorization_header_verified":True,
              "build_all_restored_state":read("build-all.json")["state"],
              "build_all_total_runs":read("build-all-runs.json")["total_count"],
              "altstore_total_runs":read("altstore-runs.json")["total_count"],
              "assets":[{"id":a["id"],"name":a["name"],"size":a["size"],"digest":a.get("digest"),"url":a["browser_download_url"]} for a in release["assets"]]
          }
          print("BEGIN_PUBLICATION_JSON")
          print(json.dumps(result,indent=2))
          print("END_PUBLICATION_JSON")
          PY
