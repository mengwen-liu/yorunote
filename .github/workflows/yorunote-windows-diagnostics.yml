name: Yorunote Windows Caption Fix Public Verification
run-name: Verify public Windows caption fix preview 3
on:
  push:
    branches: ['codex/yorunote-windows-overlay-fix-20261106']
    paths: ['.github/workflows/yorunote-windows-diagnostics.yml']
permissions:
  actions: read
  contents: read
jobs:
  verify-public:
    if: github.repository_id == '1421354314' && github.ref == 'refs/heads/codex/yorunote-windows-overlay-fix-20261106'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Verify public ZIP, checksum, tag and restored workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/mengwen-liu/yorunote/releases/436759456 > release.json
          gh api repos/mengwen-liu/yorunote/git/ref/tags/v0.1.0-windows-preview.3 > tag.json
          gh api repos/mengwen-liu/yorunote/actions/workflows/386674685 > build-all.json
          gh api 'repos/mengwen-liu/yorunote/actions/workflows/main.yml/runs?per_page=1' > build-all-runs.json
          gh api 'repos/mengwen-liu/yorunote/actions/workflows/update_alt_store.yml/runs?per_page=1' > altstore-runs.json
          curl --fail --location --silent --show-error --retry 0 --proto '=https' -o public.zip 'https://github.com/mengwen-liu/yorunote/releases/download/v0.1.0-windows-preview.3/Yorunote_windows_x64_07406c9f_preview.zip'
          curl --fail --location --silent --show-error --retry 0 --proto '=https' -o public.sha256 'https://github.com/mengwen-liu/yorunote/releases/download/v0.1.0-windows-preview.3/Yorunote_windows_x64_07406c9f_preview.zip.sha256'
          python3 - <<'PY'
          import hashlib,io,json,pathlib,struct,zipfile
          def read(name): return json.loads(pathlib.Path(name).read_text())
          source="07406c9f6a6d105fd854cb3ddc22cfcc6dacfd9b"
          filename="Yorunote_windows_x64_07406c9f_preview.zip"
          release=read("release.json");tag=read("tag.json")
          assert release["id"]==436759456 and release["draft"] is False and release["prerelease"] is True
          assert release["tag_name"]=="v0.1.0-windows-preview.3" and release["published_at"]=="2026-11-06T16:59:20Z"
          assert tag["object"]["type"]=="commit" and tag["object"]["sha"]==source
          assert {a["id"] for a in release["assets"]}=={717856788,717856792}
          raw=pathlib.Path("public.zip").read_bytes()
          digest=hashlib.sha256(raw).hexdigest()
          assert len(raw)==22015039 and digest=="cf7d5a616af30867349bb9136a491188d7a28a12e0d4778f9a2a1c74e6257ed3"
          checksum=pathlib.Path("public.sha256").read_bytes()
          assert checksum==(digest+"  "+filename+chr(10)).encode()
          assert hashlib.sha256(checksum).hexdigest()=="7bcc0289795cec5ba9c634f3d06255273e52f4a2c71c8576470f7ce4a926a9e8"
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              assert archive.testzip() is None
              assert json.loads(archive.read("Yorunote/BUILD_INFO.json"))["source_commit"]==source
              lines=archive.read("Yorunote/SHA256SUMS.txt").decode().splitlines()
              assert len(lines)==54
              for line in lines:
                  expected,path=line.split("  ",1)
                  assert hashlib.sha256(archive.read("Yorunote/"+path)).hexdigest()==expected
              assert hashlib.sha256(archive.read("Yorunote/data/flutter_assets/assets/brand/yorunote_mascot.gif")).hexdigest()=="4331c743dc0005ab2b55063221d7adcee027115dca928a4e2c96ac81d88e8fcb"
          assert read("build-all.json")["state"]=="active"
          assert read("build-all-runs.json")["total_count"]==0
          assert read("altstore-runs.json")["total_count"]==0
          result={"release_id":436759456,"url":release["html_url"],"published_at":release["published_at"],"draft":release["draft"],"prerelease":release["prerelease"],"tag":tag["ref"],"source_commit":source,"zip":filename,"zip_bytes":len(raw),"zip_sha256":digest,"checksum_sha256":hashlib.sha256(checksum).hexdigest(),"manifest_files_verified":len(lines),"gif_sha256":"4331c743dc0005ab2b55063221d7adcee027115dca928a4e2c96ac81d88e8fcb","public_downloads_without_authorization_header_verified":True,"build_all_restored_state":read("build-all.json")["state"],"build_all_total_runs":read("build-all-runs.json")["total_count"],"altstore_total_runs":read("altstore-runs.json")["total_count"],"assets":[{"id":a["id"],"name":a["name"],"size":a["size"],"digest":a["digest"],"url":a["browser_download_url"]} for a in release["assets"]]}
          print("BEGIN_PUBLICATION_JSON")
          print(json.dumps(result,indent=2))
          print("END_PUBLICATION_JSON")
          PY
          
