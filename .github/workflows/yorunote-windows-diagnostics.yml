name: Yorunote Windows Mascot Release Assets
run-name: Attach verified Windows mascot ZIP to preview 2 draft
on:
  push:
    branches: ['codex/yorunote-windows-mascot-20261106']
    paths: ['.github/workflows/yorunote-windows-diagnostics.yml']
permissions:
  actions: read
  contents: write
jobs:
  attach-to-existing-draft:
    if: github.repository_id == '1421354314' && github.ref == 'refs/heads/codex/yorunote-windows-mascot-20261106'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Verify and attach only the existing ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/mengwen-liu/yorunote/actions/runs/42202302352 > build.json
          gh api repos/mengwen-liu/yorunote/actions/artifacts/13494594716 > artifact.json
          gh api repos/mengwen-liu/yorunote/releases/436440069 > release-before.json
          gh api repos/mengwen-liu/yorunote/git/ref/heads/codex/yorunote-windows-6df02c0f > source-ref.json
          gh api repos/mengwen-liu/yorunote/actions/artifacts/13494594716/zip > artifact.zip
          python3 - <<'PY'
          import hashlib,io,json,pathlib,stat,zipfile
          def read(name): return json.loads(pathlib.Path(name).read_text())
          def digest(data): return hashlib.sha256(data).hexdigest()
          source="6df02c0fda1978319355a51fc2c75f7d66ea6d7f"
          name="Yorunote_windows_x64_6df02c0f_preview.zip"
          expected="33338805489e5f4068b83ed2d37a22ed374c4189646b460f0c880d0e735a0bb1"
          run=read("build.json");meta=read("artifact.json");release=read("release-before.json")
          assert run["id"]==42202302352 and run["status"]=="completed" and run["conclusion"]=="success"
          assert run["head_sha"]=="4eedee2d2a4293f41156512caab9ed63a0a1544a"
          assert meta["id"]==13494594716 and meta["workflow_run"]["id"]==run["id"] and not meta["expired"]
          assert meta["digest"]=="sha256:1e0428b0c9b66f8024372cd61451df1aeba4aa3dadc6be7cc505199f365f15a9"
          assert release["id"]==436440069 and release["tag_name"]=="v0.1.0-windows-preview.2"
          assert release["draft"] and release["prerelease"] and release["published_at"] is None
          assert release["target_commitish"]=="codex/yorunote-windows-6df02c0f" and not release["assets"]
          assert source in release["body"] and expected in release["body"]
          assert read("source-ref.json")["object"]=={"sha":source,"type":"commit","url":"https://api.github.com/repos/mengwen-liu/yorunote/git/commits/"+source}
          raw=pathlib.Path("artifact.zip").read_bytes()
          assert len(raw)==21975128 and digest(raw)==meta["digest"][7:]
          with zipfile.ZipFile(io.BytesIO(raw)) as artifact:
              names=artifact.namelist()
              assert len(names)==2 and set(names)=={name,name+".sha256"}
              assert artifact.testzip() is None
              for item in artifact.infolist():
                  p=pathlib.PurePosixPath(item.filename)
                  assert not p.is_absolute() and ".." not in p.parts and "\\" not in item.filename
                  assert not stat.S_ISLNK(item.external_attr >> 16)
              product=artifact.read(name);checksum=artifact.read(name+".sha256")
              assert len(product)==22013335 and digest(product)==expected
              assert checksum==(expected+"  "+name+"\n").encode("ascii")
              assert digest(checksum)=="f1c335fb2d9cfa13c287317bfe6dbf25de13627bee88696153217a46aae8ab20"
              with zipfile.ZipFile(io.BytesIO(product)) as bundle:
                  assert bundle.testzip() is None
                  assert json.loads(bundle.read("Yorunote/BUILD_INFO.json"))["source_commit"]==source
                  assert digest(bundle.read("Yorunote/data/flutter_assets/assets/brand/yorunote_mascot.gif"))=="4331c743dc0005ab2b55063221d7adcee027115dca928a4e2c96ac81d88e8fcb"
              out=pathlib.Path("upload");out.mkdir()
              (out/name).write_bytes(product);(out/(name+".sha256")).write_bytes(checksum)
          print("All source, draft, original artifact, product ZIP, checksum and GIF checks passed before upload.")
          PY
          gh release upload v0.1.0-windows-preview.2 upload/Yorunote_windows_x64_6df02c0f_preview.zip upload/Yorunote_windows_x64_6df02c0f_preview.zip.sha256 --repo mengwen-liu/yorunote
          gh api repos/mengwen-liu/yorunote/releases/436440069 > release-after.json
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          release=json.loads(pathlib.Path("release-after.json").read_text())
          name="Yorunote_windows_x64_6df02c0f_preview.zip"
          checks={name:(22013335,"33338805489e5f4068b83ed2d37a22ed374c4189646b460f0c880d0e735a0bb1"),name+".sha256":(108,"f1c335fb2d9cfa13c287317bfe6dbf25de13627bee88696153217a46aae8ab20")}
          assert release["draft"] and release["prerelease"] and release["published_at"] is None
          assert len(release["assets"])==2 and {a["name"] for a in release["assets"]}==set(checks)
          assets=[]
          for asset in release["assets"]:
              size,expected=checks[asset["name"]]
              target=pathlib.Path("readback-"+str(asset["id"]))
              with target.open("wb") as f:
                  subprocess.run(["gh","api","-H","Accept: application/octet-stream","repos/mengwen-liu/yorunote/releases/assets/"+str(asset["id"])],stdout=f,check=True)
              data=target.read_bytes();actual=hashlib.sha256(data).hexdigest()
              assert asset["size"]==size and len(data)==size and actual==expected
              assert asset["digest"]=="sha256:"+expected
              assets.append({"id":asset["id"],"name":asset["name"],"size":size,"sha256":actual,"url":asset["browser_download_url"]})
          result={"release_id":release["id"],"tag":release["tag_name"],"draft":release["draft"],"prerelease":release["prerelease"],"published_at":release["published_at"],"target":release["target_commitish"],"source_commit":"6df02c0fda1978319355a51fc2c75f7d66ea6d7f","source_run":42202302352,"artifact_id":13494594716,"artifact_sha256":"1e0428b0c9b66f8024372cd61451df1aeba4aa3dadc6be7cc505199f365f15a9","assets":assets,"downloaded_after_attachment":True}
          print("BEGIN_ATTACH_JSON")
          print(json.dumps(result,indent=2))
          print("END_ATTACH_JSON")
          PY
          
