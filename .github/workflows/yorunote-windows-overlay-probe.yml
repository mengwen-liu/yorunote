name: Yorunote Windows Overlay Regression
run-name: Reproduce real caption Overlay failure and verify targeted fix

on:
  push:
    branches: ['codex/yorunote-windows-overlay-fix-20261106']
    paths: ['.github/workflows/yorunote-windows-overlay-probe.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: yorunote-windows-overlay-regression
  cancel-in-progress: false

jobs:
  windows-regression:
    if: github.repository_id == '1421354314' && github.ref == 'refs/heads/codex/yorunote-windows-overlay-fix-20261106'
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'a5a23007bea206b8eaa8c5bbc6679bacf8aabe1a'
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.41.4'
          channel: stable
          architecture: x64
          cache: true
      - name: Resolve fixed SDK and dependencies
        run: |
          flutter --version
          if ($LASTEXITCODE -ne 0) { throw 'SDK bootstrap failed' }
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Locked pub get failed' }
          $env:EVIDENCE = Join-Path $env:RUNNER_TEMP 'overlay-regression'
          "EVIDENCE=$env:EVIDENCE" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE | Out-Null
      - name: Reproduce missing Overlay with the final test on the old application
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'overlay-baseline'
          git fetch --no-tags --depth=1 origin 6df02c0fda1978319355a51fc2c75f7d66ea6d7f
          if ($LASTEXITCODE -ne 0) { throw 'Baseline fetch failed' }
          git worktree add --detach $baseline 6df02c0fda1978319355a51fc2c75f7d66ea6d7f
          if ($LASTEXITCODE -ne 0) { throw 'Baseline worktree failed' }
          Copy-Item -LiteralPath test/brand/windows_window_frame_overlay_test.dart -Destination (Join-Path $baseline 'test/brand/windows_window_frame_overlay_test.dart')
          Push-Location $baseline
          try {
            flutter pub get --enforce-lockfile
            if ($LASTEXITCODE -ne 0) { throw 'Baseline pub get failed' }
            flutter test --no-pub --reporter expanded test/brand/windows_window_frame_overlay_test.dart 2>&1 | Tee-Object -FilePath (Join-Path $env:EVIDENCE 'baseline.log')
            $code = $LASTEXITCODE
          } finally { Pop-Location }
          $log = Get-Content -Raw -LiteralPath (Join-Path $env:EVIDENCE 'baseline.log')
          if ($code -eq 0 -or $log -notmatch 'No Overlay widget found') { throw 'The actual Overlay failure was not reproduced' }
          @{source='6df02c0fda1978319355a51fc2c75f7d66ea6d7f'; exit_code=$code; expected_missing_overlay=$true} | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:EVIDENCE 'baseline.json')
          exit 0
      - name: Format validation tools and check native pointer declarations
        run: |
          dart format test/brand/windows_window_frame_overlay_test.dart tool/windows/smoke.dart
          if ($LASTEXITCODE -ne 0) { throw 'Formatter failed' }
          @'
          import base64,pathlib
          for p in ["test/brand/windows_window_frame_overlay_test.dart","tool/windows/smoke.dart"]:
              print("FORMATTED_FILE "+p+" "+base64.b64encode(pathlib.Path(p).read_bytes()).decode())
          '@ | python -
          $parseTokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tool/windows/run_smoke.ps1'),
            [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count) { $parseErrors | Format-List; throw 'PowerShell syntax check failed' }
          $driverText = Get-Content -Raw -LiteralPath 'tool/windows/run_smoke.ps1'
          $nativeCode = [regex]::Match($driverText, "(?s)Add-Type @'\r?\n(.*?)\r?\n'@").Groups[1].Value
          if (-not $nativeCode) { throw 'Native input declarations missing' }
          Add-Type -TypeDefinition $nativeCode
          $inputValue = [YorunoteCapture+INPUT64]::new()
          if ([Runtime.InteropServices.Marshal]::SizeOf($inputValue) -ne 40) { throw 'INPUT64 size mismatch' }
      - name: Run real caption and previous Windows regressions
        run: |
          flutter test --no-pub --reporter expanded test/brand/windows_window_frame_overlay_test.dart test/brand/windows_title_brand_test.dart test/brand/yorunote_brand_test.dart test/foundation/favorites_follow_updates_test.dart test/reader/reader_image_loading_test.dart 2>&1 | Tee-Object -FilePath (Join-Path $env:EVIDENCE 'candidate.log')
          if ($LASTEXITCODE -ne 0) { throw 'Candidate regression failed' }
          flutter analyze --no-pub test/brand/windows_window_frame_overlay_test.dart tool/windows/smoke.dart
          if ($LASTEXITCODE -ne 0) { throw 'New test analyzer failed' }
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yorunote-windows-overlay-regression
          path: '${{ runner.temp }}/overlay-regression/'
          if-no-files-found: warn
          retention-days: 14
