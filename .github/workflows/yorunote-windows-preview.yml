name: Yorunote Windows Preview
run-name: Windows x64 preview - fixed source 5934db5e

on:
  push:
    branches: ['codex/yorunote-windows-preview-20261106']
    paths: ['.github/workflows/yorunote-windows-preview.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: yorunote-windows-preview
  cancel-in-progress: false

jobs:
  windows-x64:
    if: github.repository_id == '1421354314' && github.ref == 'refs/heads/codex/yorunote-windows-preview-20261106'
    runs-on: windows-2022
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_SHA: '5934db5ef963f05d409fa3182094011d24e8a25b'
      YORUNOTE_SMOKE_SOURCE: '5934db5ef963f05d409fa3182094011d24e8a25b'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      PUB_ENVIRONMENT: github-actions

    steps:
      - name: Checkout fixed application source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: '5934db5ef963f05d409fa3182094011d24e8a25b'
          persist-credentials: false

      - name: Verify source and prepare evidence
        run: |
          $env:EVIDENCE = Join-Path $env:RUNNER_TEMP 'yorunote-windows-evidence'
          $env:DIST = Join-Path $env:RUNNER_TEMP 'yorunote-windows-dist'
          "EVIDENCE=$env:EVIDENCE" >> $env:GITHUB_ENV
          "DIST=$env:DIST" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE | Out-Null
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:SOURCE_SHA) { throw 'Source SHA mismatch' }
          $tracked = git status --porcelain --untracked-files=no
          if ($tracked) { throw 'Source checkout is dirty' }
          $identity = @{
            source = $head
            workflow_sha = '${{ github.sha }}'
            repository_id = '${{ github.repository_id }}'
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
          }
          $identity | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:EVIDENCE 'source.json')
          $identity | ConvertTo-Json
          $parseTokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tool/windows/run_smoke.ps1'),
            [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count) { $parseErrors | Format-List; throw 'PowerShell syntax check failed' }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Check Python tools and install fixed image tool
        run: |
          python -c "import ast,pathlib; [ast.parse(pathlib.Path(p).read_text(encoding='utf-8')) for p in ['windows/build.py','windows/make_icon.py']]; print('Python syntax OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed' }
          python -m pip install --disable-pip-version-check --no-deps -r windows/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed' }
          python windows/make_icon.py --evidence $env:EVIDENCE
          if ($LASTEXITCODE -ne 0) { throw 'Windows icon checks failed' }

      - name: Set up fixed Flutter SDK
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.41.4'
          channel: stable
          architecture: x64
          cache: true

      - name: Check SDK and Windows native toolchain
        run: |
          flutter --version | Tee-Object -FilePath (Join-Path $env:EVIDENCE 'flutter-bootstrap.log')
          if ($LASTEXITCODE -ne 0) { throw 'Flutter bootstrap failed' }
          flutter --version --machine | Set-Content -Encoding utf8 (Join-Path $env:EVIDENCE 'flutter-version.json')
          if ($LASTEXITCODE -ne 0) { throw 'Flutter version check failed' }
          $sdk = Get-Content -Raw (Join-Path $env:EVIDENCE 'flutter-version.json') | ConvertFrom-Json
          if ($sdk.flutterVersion -ne '3.41.4' -or $sdk.dartSdkVersion -notmatch '^3\.11\.1(?:[ (]|$)') {
            throw 'Unexpected Flutter or Dart version'
          }
          flutter doctor -v | Tee-Object -FilePath (Join-Path $env:EVIDENCE 'flutter-doctor.log')
          $doctorExit = $LASTEXITCODE
          "flutter doctor exit: $doctorExit" | Add-Content (Join-Path $env:EVIDENCE 'flutter-doctor.log')
          rustup show | Tee-Object -FilePath (Join-Path $env:EVIDENCE 'rustup-show.log')
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust toolchain is unavailable' }

      - name: Resolve locked application dependencies
        run: |
          flutter pub get --enforce-lockfile | Tee-Object -FilePath (Join-Path $env:EVIDENCE 'pub-get.log')
          if ($LASTEXITCODE -ne 0) { throw 'Locked pub get failed' }
          git diff --exit-code -- pubspec.yaml pubspec.lock
          if ($LASTEXITCODE -ne 0) { throw 'Dependencies changed' }

      - name: Analyze Windows acceptance entry point
        run: |
          flutter analyze --no-pub tool/windows/smoke.dart | Tee-Object -FilePath (Join-Path $env:EVIDENCE 'analyze-windows-tool.log')
          if ($LASTEXITCODE -ne 0) { throw 'Windows acceptance analyzer failed' }
          dart format --output=show tool/windows/smoke.dart | Tee-Object -FilePath (Join-Path $env:EVIDENCE 'format-windows-tool.log')
          if ($LASTEXITCODE -ne 0) { throw 'Dart format parsing failed' }

      - name: Run existing brand checks on Windows
        run: |
          flutter test --no-pub --reporter expanded test/brand/yorunote_brand_test.dart | Tee-Object -FilePath (Join-Path $env:EVIDENCE 'brand-tests.log')
          if ($LASTEXITCODE -ne 0) { throw 'Brand tests failed' }

      - name: Build distributable Windows Release
        run: |
          flutter build windows --release --no-pub | Tee-Object -FilePath (Join-Path $env:EVIDENCE 'build-distribution.log')
          if ($LASTEXITCODE -ne 0) { throw 'Windows Release build failed' }

      - name: Package and statically verify ZIP
        run: |
          python windows/build.py --bundle build/windows/x64/runner/Release --source-sha $env:SOURCE_SHA --output $env:DIST --evidence $env:EVIDENCE
          if ($LASTEXITCODE -ne 0) { throw 'ZIP packaging verification failed' }
          $archives = @(Get-ChildItem -LiteralPath $env:DIST -Filter '*.zip' -File)
          if ($archives.Count -ne 1) { throw 'Expected one distribution ZIP' }
          $extract = Join-Path $env:RUNNER_TEMP 'yorunote-distribution-extracted'
          if (Test-Path -LiteralPath $extract) { throw 'Extraction target already exists' }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $extract
          $env:YORUNOTE_DISTRIBUTION_EXE = Join-Path $extract 'Yorunote/yorunote.exe'
          "YORUNOTE_DISTRIBUTION_EXE=$env:YORUNOTE_DISTRIBUTION_EXE" >> $env:GITHUB_ENV
          $auth = Get-AuthenticodeSignature -LiteralPath $env:YORUNOTE_DISTRIBUTION_EXE
          @{status=$auth.Status.ToString(); source=$env:SOURCE_SHA} | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:EVIDENCE 'authenticode.json')

      - name: Launch actual extracted distribution
        run: |
          & ./tool/windows/run_smoke.ps1 -Exe $env:YORUNOTE_DISTRIBUTION_EXE -Evidence $env:EVIDENCE -Phase distribution

      - name: Build instrumented native acceptance executable
        run: |
          flutter build windows --release --no-pub --target tool/windows/smoke.dart | Tee-Object -FilePath (Join-Path $env:EVIDENCE 'build-acceptance.log')
          if ($LASTEXITCODE -ne 0) { throw 'Windows acceptance build failed' }

      - name: Exercise native source, reading and downloads
        run: |
          & ./tool/windows/run_smoke.ps1 -Exe build/windows/x64/runner/Release/yorunote.exe -Evidence $env:EVIDENCE -Phase seed

      - name: Restart and verify persisted data and offline reading
        run: |
          & ./tool/windows/run_smoke.ps1 -Exe build/windows/x64/runner/Release/yorunote.exe -Evidence $env:EVIDENCE -Phase restart

      - name: Verify checkout and final artifact hashes
        run: |
          git diff --exit-code HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source was changed by the build' }
          $package = Get-Content -Raw (Join-Path $env:EVIDENCE 'package.json') | ConvertFrom-Json
          $archive = Join-Path $env:DIST $package.zip
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $package.zip_sha256) { throw 'Final ZIP hash mismatch' }
          $checksum = [IO.File]::ReadAllText($archive+'.sha256')
          if ($checksum -ne ($hash+'  '+$package.zip+"`n")) { throw 'Checksum file mismatch' }
          foreach ($phase in @('seed','restart')) {
            $report = Get-Content -Raw (Join-Path $env:EVIDENCE ('smoke-'+$phase+'.json')) | ConvertFrom-Json
            if (-not $report.passed -or $report.source -ne $env:SOURCE_SHA) { throw 'Acceptance report mismatch' }
          }
          "Source: $env:SOURCE_SHA" >> $env:GITHUB_STEP_SUMMARY
          "ZIP: $($package.zip)" >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
          "Native Windows CI acceptance passed; user-device validation and public release remain pending." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload verified Windows ZIP and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yorunote-windows-x64-preview
          path: '${{ runner.temp }}/yorunote-windows-dist/*'
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics and synthetic-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yorunote-windows-x64-evidence
          path: '${{ runner.temp }}/yorunote-windows-evidence/'
          if-no-files-found: warn
          retention-days: 14
